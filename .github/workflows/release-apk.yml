name: Build and attach release APK

on:
  release:
    types: [published]
  # Run by hand to cut a release: creates it on main with generated notes, then attaches the APK.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, vX.Y.Z"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore

      # app/build.gradle.kts reads the release* keys from local.properties.
      - name: Write local.properties
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          cat >> local.properties <<PROPS
          releaseStoreFile=${{ github.workspace }}/release.keystore
          releaseStorePassword=$RELEASE_STORE_PASSWORD
          releaseKeyAlias=$RELEASE_KEY_ALIAS
          releaseKeyPassword=$RELEASE_KEY_PASSWORD
          PROPS

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseParallelGC -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8"

      # The R8 mapping is the only way to read a stack trace from this exact build.
      - name: Compress R8 mapping
        run: gzip -c app/build/outputs/mapping/release/mapping.txt > "mapping-$TAG.txt.gz"

      # Tags are "vX.Y.Z", so the asset reads "Mono-vX.Y.Z.apk".
      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk "Mono-$TAG.apk"

      - name: Upload APK and mapping to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            Mono-*.apk
            mapping-*.txt.gz

      - name: Clean up keystore
        if: always()
        run: rm -f release.keystore local.properties
