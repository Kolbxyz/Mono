name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test & lint
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Static analysis (detekt)
        run: ./gradlew :app:detekt

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: No file over 300 lines
        run: |
          over=$(find app/src -name '*.kt' -exec awk 'END { if (NR > 300) print FILENAME ": " NR }' {} \;)
          if [ -n "$over" ]; then echo "$over"; exit 1; fi

  no-ai-trailers:
    name: No AI attribution in commits
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check commit messages
        run: |
          for c in $(git log origin/${{ github.base_ref }}..HEAD --pretty=format:"%H"); do
            if git log -1 --pretty=format:"%B" "$c" | grep -Eiq "(co-authored-by:.*(claude|anthropic|chatgpt|openai|copilot|gemini)|generated (with|by) (claude|chatgpt|copilot))"; then
              echo "::error::Commit $c carries AI attribution (CLAUDE.md hard rule)."
              exit 1
            fi
          done
